name = "borderland-bingo"
main = "worker/index.js"
compatibility_date = "2026-11-20"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "BINGO_ROOMS"
class_name = "BingoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BingoRoom"]
